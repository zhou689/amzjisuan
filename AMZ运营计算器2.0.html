function validate(o){if(!o||typeof o!=='object'||Array.isArray(o))throw Error('参数格式不正确');const r={};for(const [k,v]of Object.entries(o)){const match=k.match(/^(\d+):([A-Z]+[1-9]\d*)$/);if(!match)throw Error('未知参数：'+k);const sheet=BOOK[+match[1]],c=sheet?.cells[match[2]];if(!sheet||c?.f||(!c&&!(+match[1]===2&&['B9','U9'].includes(match[2])))|| (c&&!numeric(c.v))||typeof v!=='number'||!Number.isFinite(v))throw Error('无效参数：'+k);r[k]=v;}return r;}
function raw(s,c){const key=s+':'+c;return Object.hasOwn(params,key)?params[key]:BOOK[s].cells[c]?.v??0;}
function value(s,c,trail=new Set){const key=s+':'+c;if(Object.hasOwn(cache,key))return cache[key];if(trail.has(key))return NaN;const cell=BOOK[s].cells[c];if(!cell?.f)return raw(s,c);trail.add(key);let v;try{v=parseFormula(cell.f,ref=>value(s,ref,new Set(trail)));}catch(e){v=NaN;}cache[key]=Number.isFinite(v)?v:NaN;return cache[key];}
// Arithmetic parser for the original workbook. No eval and no external libraries.
function parseFormula(f,get){if(f.includes('#REF!'))throw Error('失效引用');let tokens=[],pos=0;const re=/\s*(<=|>=|<>|[+\-*/(),=<>]|[A-Z]+\d+|[A-Z]+|(?:\d+\.?\d*|\.\d+)(?:[Ee][+\-]?\d+)?)/gy;while(pos<f.length){re.lastIndex=pos;const m=re.exec(f);if(!m)throw Error('无法解析公式');tokens.push(m[1]);pos=re.lastIndex;}let i=0;
function atom(){const t=tokens[i++];if(t==='+'||t==='-')return(t==='-'?-1:1)*atom();if(t==='('){const v=compare();if(tokens[i++]!==')')throw Error('括号');return v;}if(/^\d|^\./.test(t||''))return Number(t);if(/^[A-Z]+\d+$/.test(t||'')){const v=Number(get(t));if(!Number.isFinite(v))throw Error('非数字');return v;}if(t==='IF'||t==='ROUND'){if(tokens[i++]!=='(')throw Error('函数');const args=[compare()];while(tokens[i]===','){i++;args.push(compare());}if(tokens[i++]!==')')throw Error('函数括号');if(t==='IF')return args[0]?args[1]:args[2];const factor=10**args[1];return Math.sign(args[0])*Math.round(Math.abs(args[0])*factor)/factor;}throw Error('无效标记');}
function mul(){let v=atom();while(['*','/'].includes(tokens[i])){const op=tokens[i++],b=atom();v=op==='*'?v*b:v/b;}return v;}
function sum(){let v=mul();while(['+','-'].includes(tokens[i])){const op=tokens[i++],b=mul();v=op==='+'?v+b:v-b;}return v;}
function compare(){let v=sum();while(['<=','>=','<>','=','<','>'].includes(tokens[i])){const op=tokens[i++],b=sum();v=op==='<='?v<=b:op==='>='?v>=b:op==='<>'?v!==b:op==='='?v===b:op==='<'?v<b:v>b;}return v;}
const v=compare();if(i!==tokens.length)throw Error('多余标记');return v;}

function fbm(){return metrics([['B12','美国单件利润','USD'],['U12','加拿大单件利润','CAD'],['L3','美国物流总费用','¥'],['R3','加拿大物流总费用','¥']])+`<div class="layout"><div>`+panel('商品与共用费用',fields([['L16','采购价','¥'],['L17','重量','kg',1,.000001],['L15','国内快递费','¥'],['L20','佣金','%',1,0,100]]))+panel('美国售价',fields([['L18','售价整数部分','USD'],['M18','售价小数部分','USD',1,0,.999999],['B4','向买家收取运费','USD'],['B9','优惠折扣','%',1,0,100],['B16','汇率：1 USD 折合人民币','¥',1,.000001]]),'保留原表“整数部分 + 小数部分”的售价结构。')+panel('加拿大售价',fields([['L19','售价整数部分','CAD'],['M19','售价小数部分','CAD',1,0,.999999],['U4','向买家收取运费','CAD'],['U9','优惠折扣','%',1,0,100],['U16','汇率：1 CAD 折合人民币','¥',1,.000001]]))+`</div><div>`+panel('美国 · 利润与回款',outputs([['B8','产品售价','USD'],['B5','最低售价（不含买家运费）','USD'],['B10','折后商品价格','USD'],['B7','折后商品价 + 买家运费','USD'],['B13','销售回款（扣佣金）','USD'],['B14','实际成本（原表口径）','USD'],['E2','投入','¥'],['E8','商品售价折人民币','¥'],['E12','利润','¥'],['E11','EP（利润再减投入）','¥'],['E13','投产','%'],['E14','利润 / 销售回款','%']]))+panel('加拿大 · 利润与回款',outputs([['U8','产品售价','CAD'],['U5','最低售价（不含买家运费）','CAD'],['U10','折后商品价格','CAD'],['U7','折后商品价 + 买家运费','CAD'],['U13','销售回款（扣佣金）','CAD'],['U14','实际成本（原表口径）','CAD'],['X2','投入','¥'],['X8','商品售价折人民币','¥'],['X12','利润','¥'],['X11','EP（利润再减投入）','¥'],['X13','投产','%'],['X14','利润 / 销售回款','%']]))+`</div></div><div class="layout">`+panel('义达 · 美国运费表',logistics('美国',6,10,['H','I','J']),'运费总额 = 重量 × 每公斤运费 + 挂号费 + 国内快递费。')+panel('极兔 · 加拿大普货运费表',logistics('加拿大',6,13,['N','O','P']),'保留原表 IF 分段阈值；表中文字区间也按原文件显示。')+`</div><div id="weightWarning" class="warning"></div>`+note('物流报价为原表样例，未更新。美国超过 31 kg、加拿大超过 5 kg 时，原公式仍套用最后一档。加拿大原表的“¢”统一显示为 CAD；EP 和实际成本仍使用原公式。');}

function bids(){return metrics([['C2','搜索结果顶部','$'],['C3','商品页面','$'],['C4','搜索结果其余位置','$']])+`<div class="layout">`+panel('基础出价与广告位调整',fields([['B6','关键词基础出价','$'],['B2','搜索结果顶部加价','%',100],['B3','商品页面加价','%',100],['B4','其余位置加价','%',100]]))+panel('计算口径',`<p>原表计算：基础出价 ×（1 + 广告位调整比例）。</p><p class="section-note">结果为原表模拟点击成本，不包含动态竞价等其他调整，也不等于实际扣费。</p>`)+`</div>`+note('原表 I10、I11、I12 含 #REF! 失效引用，保留在下方原始单元格中并显示“—”；这三处不参与广告位模拟。');}

function investment(){return metrics([['B13','第 1 月当前总投入','¥'],['B24','第 2 月当前总投入','¥'],['B36','后续每月预计利润','¥'],['B37','预计回收全部投入','月']])+note('本页为原表“多店铺刷单模式投入计算”的历史内容转换，未改动其公式。B5 固定除以 7（并非引用汇率）；回本公式使用 B33 / B36 + 3。负利润或零利润时不应将结果理解为可回本。')+`<div class="layout"><div>`+panel('原表基础参数',fields([['B1','汇率','¥',1,.000001],['B2','采购成本','¥'],['B3','头程','¥'],['B4','折后价格','$'],['E4','平台佣金','%',1,0,100],['E5','FBA 配送费','$'],['E1','预计损耗占销售额','%',100,0,100],['E2','推广投入占销售额','%',100,0,100],['B6','原表刷单佣金','$'],['B7','目标月销量','单'],['B10','首次备货','件'],['B16','原表 15 天刷单数量','单']]))+panel('原表其他支出',fields([['H1','海外仓首次支出','¥'],['H2','购买店铺数','个'],['H3','单店铺价格','¥'],['H4','注册 TM 标','¥'],['H5','买 R 标','¥']])+outputs([['H6','其他总支出','¥'],['B5','产品利润（原公式）','$'],['E6','每单回款','$']]))+`</div><div>`+panel('第 1 月',outputs([['B11','备货成本','¥'],['B13','当前总投入','¥']]))+panel('第 2 月',outputs([['E16','销售订单量','单'],['B17','原表刷单佣金支出','¥'],['B19','原表刷单返现','¥'],['B20','原表刷单总支出','¥'],['G17','推广投入','¥'],['I17','日均推广投入','$'],['G19','预计销售回款','¥'],['G20','预计损耗','¥'],['I20','日均预计损耗','$'],['B22','下月备货成本','¥'],['B24','当前总投入','¥'],['E24','当月账户余额','¥'],['E25','原表刷单账户余额','¥'],['G24','两类账户余额合计','¥']]))+panel('第 3 月与后续',outputs([['B27','本月回款金额','¥'],['E27','销售订单量','单'],['G28','推广投入','¥'],['I28','日均推广投入','$'],['G30','预计销售回款','¥'],['G31','预计损耗','¥'],['I31','日均预计损耗','$'],['B29','下月备货成本','¥'],['B33','当前总投入','¥'],['E33','当月账户余额','¥'],['B36','每月预计利润','¥'],['B37','原表回收全部投入时间','月']]))+`<div id="paybackWarning" class="warning"></div></div></div>`;}
function source(){return `<details class="panel source"><summary>查看原始单元格与公式 · ${esc(BOOK[active].name)}${BOOK[active].hidden?'（原表隐藏）':''}</summary><div class="table-wrap"><table><thead><tr><th>单元格</th><th>当前值</th><th>Excel 公式</th></tr></thead><tbody>`+Object.entries(BOOK[active].cells).map(([c,x])=>`<tr><td>${c}</td><td class="source-cell">${x.f?`<span data-result="${c}" data-raw="1"></span>`:numeric(x.v)?`<span data-result="${c}" data-raw="1"></span>`:esc(x.v)}</td><td class="formula">${x.f?'='+esc(x.f):''}</td></tr>`).join('')+'</tbody></table></div></details>';}
function render(){cache={};document.getElementById('nav').innerHTML=titles.map((t,i)=>`<button data-tab="${i}" class="${active===i?'active':''}" ${active===i?'aria-current="page"':''}><span class="num">0${i+1}</span>${esc(t)}</button>`).join('');const builders=[()=>fba(),()=>fba(true),fbm,sizes,bids,balance,()=>panel('在线选品模板',`<p>原表未包含选品计算表，仅提供了外部参考链接。</p><div class="empty-card"><a href="${esc(BOOK[6].cells.B5.v)}" target="_blank" rel="noopener noreferrer">打开原表的选品模板 ↗</a><p class="section-note" style="margin:10px 0 0">访问此链接需要网络。</p></div>`),investment];document.getElementById('content').innerHTML=`<div class="intro"><div><h2>${titles[active]}</h2><p>${desc[active]}</p></div><div class="status">修改输入，即时计算</div></div>`+builders[active]()+source();update();}
function update(){cache={};const invalid=[...document.querySelectorAll('input[data-cell]')].find(x=>!x.validity.valid||x.value==='');document.querySelectorAll('[data-result]').forEach(el=>{const v=value(active,el.dataset.result),mult=Number(el.dataset.mult||1);el.textContent=invalid?'—':el.dataset.raw?(typeof v==='number'?Number.isFinite(v)?String(Number(v.toPrecision(12))):'—':String(v)):fmt(v,el.dataset.unit||'',mult);el.classList.toggle('negative',!invalid&&v<0);el.title=invalid?'请填写有效输入':Number.isFinite(v)?(BOOK[active].cells[el.dataset.result]?.f?'原表公式：='+BOOK[active].cells[el.dataset.result].f:''):'原表失效引用或分母为零，无法计算';});if(active===2){const w=value(2,'L17');document.getElementById('weightWarning').textContent=w>5?'重量超过加拿大原表最大档位 5 kg，请核对物流报价。':'';}if(active===7){const p=value(7,'B36');document.getElementById('paybackWarning').textContent=p<=0?'每月预计利润不大于零，当前参数下无法收回全部投入。':'';}document.getElementById('saveStatus').textContent=invalid?'请完成有效输入后查看结果':storageOK?'参数自动保存在当前浏览器':'浏览器未允许本地保存，请导出参数备份';}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({version:1,params,active}));storageOK=true;}catch(e){storageOK=false;}}
let timer;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>t.classList.add('hidden'),2600);}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;active=Number(b.dataset.tab);persist();render();});
document.getElementById('content').addEventListener('input',e=>{const el=e.target;if(!el.matches('[data-cell]'))return;const n=el.valueAsNumber;if(Number.isFinite(n)&&el.validity.valid){params[active+':'+el.dataset.cell]=n/Number(el.dataset.scale||1);persist();}update();});
document.getElementById('reset').onclick=()=>{if(!confirm('将本页参数恢复为 Excel 原始值？其他页面不受影响。'))return;for(const k of Object.keys(params))if(k.startsWith(active+':'))delete params[k];persist();render();toast('本页已恢复为原表参数');};

document.getElementById('import').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>1024*1024)throw Error('文件过大');const o=JSON.parse(await file.text());if(o.app!=='AMZ运营计算器2.0'||o.version!==1)throw Error('不是此计算器的参数文件');const next=validate(o.params);params=next;if(Number.isInteger(o.active)&&o.active>=0&&o.active<8)active=o.active;persist();render();toast('参数已导入');}catch(err){toast('导入失败：'+err.message);}e.target.value='';};
